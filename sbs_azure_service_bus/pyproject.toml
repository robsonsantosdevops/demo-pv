[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-servicebus-middleware"
version = "0.1.0"
description = "Consumer middleware para o fluxo Checkout → Service Bus → Salesforce → Service Bus → SAP B1 (demo Keeggo)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "azure-servicebus>=7.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
middleware = "middleware.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
