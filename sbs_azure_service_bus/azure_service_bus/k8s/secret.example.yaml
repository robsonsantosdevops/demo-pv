# -----------------------------------------------------------------------------
# Modelo de Secret — copie para um ficheiro local (ex.: secret-local.yaml),
# preencha os valores e aplique: kubectl apply -f secret-local.yaml
# NÃO commite valores reais. Este ficheiro deve ter só placeholders.
#
# Alternativa:
#   kubectl create secret generic sb-middleware-secrets -n demo \
#     --from-literal=AZURE_SERVICE_BUS_CONNECTION_STRING='...' \
#     --from-literal=SF_USERNAME='...' \
#     ...
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: sb-middleware-secrets
  namespace: demo
  labels:
    app.kubernetes.io/name: sb-middleware
type: Opaque
stringData:
  AZURE_SERVICE_BUS_CONNECTION_STRING: "REPLACE_COM_ENDPOINT_SB_REAL"
  # Salesforce — credenciais só no cluster/CI, nunca neste ficheiro versionado.
  SF_USERNAME: ""
  SF_PASSWORD: ""
  SF_SECURITY_TOKEN: ""
  SF_CONSUMER_KEY: ""
  SF_CONSUMER_SECRET: ""
  SF_ACCOUNT_MASTER_EXTRA: '{"cnpj__c":"00000000000000"}'
  # SAP B1 (oportunidades, relatorios)
  sessionId: ""
  SAP_BASE_URL: "https://host:50000/b1s/v2"
  SAP_COMPANY_DB: ""
  SSL_VERIFY: "false"
  SF_DOMAIN: "login"
  SF_API_VERSION: "v60.0"
