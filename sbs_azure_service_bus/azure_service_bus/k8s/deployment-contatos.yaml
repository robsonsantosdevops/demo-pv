apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-middleware-contatos
  namespace: demo
  labels:
    app.kubernetes.io/name: sb-middleware-contatos
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sb-middleware-contatos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sb-middleware-contatos
        app.kubernetes.io/component: middleware
        azure.servicebus.io/queue: contatos
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: middleware
          image: demokeeggo.azurecr.io/demokeeggo/sb-middleware:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # ConfigMap primeiro; Secret injeta todas as chaves (sobrepõe chaves repetidas).
          envFrom:
            - configMapRef:
                name: sb-middleware-config
            - secretRef:
                name: sb-middleware-secrets
          env:
            - name: QUEUE_NAME
              value: contatos
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Sem liveness HTTP: durante RESTART_DELAY_SECONDS o /healthz fica em baixo; o entrypoint
          # retoma o processo após a pausa. Monitore via logs e readiness.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
