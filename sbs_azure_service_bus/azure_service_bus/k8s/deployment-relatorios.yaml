apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-middleware-relatorios
  namespace: demo
  labels:
    app.kubernetes.io/name: sb-middleware-relatorios
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sb-middleware-relatorios
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sb-middleware-relatorios
        app.kubernetes.io/component: middleware
        azure.servicebus.io/queue: relatorios
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: middleware
          image: demokeeggo.azurecr.io/demokeeggo/sb-middleware:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sb-middleware-config
            - secretRef:
                name: sb-middleware-secrets
          env:
            - name: QUEUE_NAME
              value: relatorios
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
