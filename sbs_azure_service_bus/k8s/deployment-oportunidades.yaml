apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-middleware-oportunidades
  namespace: demo
  labels:
    app.kubernetes.io/name: sb-middleware-oportunidades
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sb-middleware-oportunidades
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sb-middleware-oportunidades
        app.kubernetes.io/component: middleware
        azure.servicebus.io/queue: oportunidades
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: middleware
          image: demokeeggo.azurecr.io/demokeeggo/sb-middleware:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sb-middleware-config
          env:
            - name: QUEUE_NAME
              value: oportunidades
            - name: AZURE_SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: AZURE_SERVICE_BUS_CONNECTION_STRING
            - name: sessionId
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: sessionId
            - name: SAP_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SAP_BASE_URL
            - name: SAP_COMPANY_DB
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SAP_COMPANY_DB
            # Enriquecimento Salesforce opcional: se as chaves existirem no Secret,
            # o handler tenta autenticar; caso contrário, segue só com SAP.
            - name: SF_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_USERNAME
                  optional: true
            - name: SF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_PASSWORD
                  optional: true
            - name: SF_SECURITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_SECURITY_TOKEN
                  optional: true
            - name: SF_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_CONSUMER_KEY
                  optional: true
            - name: SF_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_CONSUMER_SECRET
                  optional: true
            - name: SF_ACCOUNT_MASTER_EXTRA
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_ACCOUNT_MASTER_EXTRA
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
