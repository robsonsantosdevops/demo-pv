apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-middleware-pedidos
  namespace: demo
  labels:
    app.kubernetes.io/name: sb-middleware-pedidos
    app.kubernetes.io/component: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sb-middleware-pedidos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sb-middleware-pedidos
        app.kubernetes.io/component: middleware
        azure.servicebus.io/queue: pedidos
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: middleware
          image: sb-middleware:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sb-middleware-config
          env:
            - name: QUEUE_NAME
              value: pedidos
            - name: AZURE_SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: AZURE_SERVICE_BUS_CONNECTION_STRING
            - name: SF_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_USERNAME
            - name: SF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_PASSWORD
            - name: SF_SECURITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_SECURITY_TOKEN
            - name: SF_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_CONSUMER_KEY
                  optional: true
            - name: SF_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_CONSUMER_SECRET
                  optional: true
            - name: SF_ACCOUNT_MASTER_EXTRA
              valueFrom:
                secretKeyRef:
                  name: sb-middleware-secrets
                  key: SF_ACCOUNT_MASTER_EXTRA
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
